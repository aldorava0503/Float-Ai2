name: Build FloatAI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FloatAI.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o FloatAI.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -type f -printf '%h\n' | head -1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatAI-debug-apk
          path: '${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk'
